name: Spring Boot Production CI/CD for AWS

on:
push:
branches:
- main
- master

jobs:
build-deploy:
runs-on: ubuntu-latest

```
steps:
  # Checkout
  - name: Checkout code
    uses: actions/checkout@v4

  # Configure AWS
  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  # Login to ECR
  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  # Build & Push Image
  - name: Build, Tag, Push Docker Image
    env:
      REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: latest
    run: |
      docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
      docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  # Deploy to EC2
  - name: Deploy to EC2 via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USERNAME }}
      key: ${{ secrets.EC2_SSH_KEY }}
      script: |
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
        | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

        docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

        docker stop advance-todo-backend || true
        docker rm advance-todo-backend || true

        docker run -d -p 8080:8080 --name advance-todo-backend \
        ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
```









































