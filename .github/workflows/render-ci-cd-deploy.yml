name: Spring Boot Production CI/CD For Render

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'       
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }} 
    env:
      IMAGE_NAME: lakshmansde/advance-todo
      IMAGE_TAG: ${{ github.sha }}

    steps:
      #  Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      #  Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      #  Build Spring Boot JAR
      - name: Build Spring Boot App
        run: mvn clean package -DskipTests

      #  Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #  Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest

      #  Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

      #  Trigger Render Redeploy
      - name: Trigger Render Redeploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

    # We can remove this to redeploy but that needs an extra service on render to watch the image is changed or not